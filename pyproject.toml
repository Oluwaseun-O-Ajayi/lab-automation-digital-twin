[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-automation-digital-twin"
version = "2.0.0"
description = "Discrete-event digital twin of laboratory automation workflows: device capacity, queues, transport, traceability and throughput"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  {name = "Oluwaseun O. Ajayi"}
]
license = {text = "MIT"}
keywords = [
  "laboratory automation",
  "digital twin",
  "discrete-event simulation",
  "sample tracking",
  "workflow simulation",
  "traceability",
  "research software"
]
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5"
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Oluwaseun-O-Ajayi/lab-automation-digital-twin"
Repository = "https://github.com/Oluwaseun-O-Ajayi/lab-automation-digital-twin"

[tool.setuptools]
packages = ["lab_digital_twin"]
